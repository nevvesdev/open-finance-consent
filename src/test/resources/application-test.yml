spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openfinance}
    username: ${SPRING_DATASOURCE_USERNAME:openfinance}
    password: ${SPRING_DATASOURCE_PASSWORD:openfinance123}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:certs/jwt-public.pem

server:
  ssl:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health