spring:
  application:
    name: open-finance-consent-hub

  datasource:
    # Use in-memory H2 by default for local testing to avoid requiring a local Postgres instance
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    # disabled by default in local test mode
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:certs/jwt-public.pem

  task:
    scheduling:
      enabled: true

server:
  port: 8080
  ssl:
    enabled: true
    key-store: classpath:certs/server.p12
    key-store-password: openfinance123
    key-store-type: PKCS12
    key-alias: openfinance
    trust-store: classpath:certs/truststore.p12
    trust-store-password: openfinance123
    trust-store-type: PKCS12
    client-auth: want

jobs:
  expire-consents:
    delay-ms: 60000
  outbox-relay:
    delay-ms: 30000

logging:
  level:
    br.com.nevvesdev: DEBUG
    org.springframework.security: DEBUG

banks:
  bank-a:
    base-url: https://localhost:8080
  bank-b:
    base-url: https://localhost:8080